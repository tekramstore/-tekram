<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تِكرَم | Tekram</title>

<style>
:root{
--g:#183d30;--g2:#244f3e;--c:#f7f0e4;--c2:#eee4d3;
--o:#df5035;--gold:#e5aa45;--w:#fffdf8;--m:#77786f;--b:#e5dac8
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--c);color:var(--g);line-height:1.6}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}

/* HEADER */
header{background:var(--g);position:sticky;top:0;z-index:20}
.head{position:relative;width:100%;display:flex;justify-content:center;align-items:center}
.site-logo{width:100%;height:auto;max-height:105px;object-fit:contain}
.logo-home{position:absolute;inset:0;z-index:1}
.icons{display:flex;gap:8px;position:absolute;z-index:3;top:12px}
.icons:first-of-type{right:5%}
.icons:last-of-type{left:5%}
.icon{
width:44px;height:44px;border:0;border-radius:50%;
background:var(--w);color:var(--g);font-size:19px
}
.cart-top{position:relative}
.count{
position:absolute;top:-4px;right:-3px;background:var(--o);
color:#fff;border-radius:20px;padding:1px 6px;font-size:10px
}

.search-wrap{background:var(--g);padding:0 5% 18px}
.search{
max-width:1250px;margin:auto;background:var(--w);height:48px;
border-radius:30px;display:flex;align-items:center;padding:0 18px;gap:8px
}
.search input{width:100%;border:0;outline:0;background:none;font-size:14px}

/* HERO */
.hero-wrap{padding:25px 5%}
.hero{
max-width:1250px;margin:auto;min-height:310px;
background:var(--g);border-radius:28px;color:#fff;
display:flex;align-items:center;justify-content:space-between;
padding:45px 8%;position:relative;overflow:hidden
}
.hero:after{
content:"";position:absolute;width:420px;height:420px;
border:1px solid #ffffff12;border-radius:50%;
left:-170px;bottom:-250px
}
.hero-text{position:relative;z-index:2;max-width:680px}
.hero-small{color:var(--gold);font-weight:bold;font-size:14px}
.hero h1{
font-size:clamp(38px,6vw,60px);
line-height:1.12;margin:10px 0 15px
}
.hero h1 span{color:#f4b04b}
.hero p{color:#eee;font-size:14px;margin-bottom:20px}
.hero button{
border:0;background:var(--o);color:#fff;
padding:12px 24px;border-radius:25px;font-weight:bold
}

/* صورة غصن الزيتون */
.hero-branch{
position:relative;
z-index:2;
width:38%;
display:flex;
justify-content:center;
align-items:center
}
.hero-branch img{
width:100%;
max-width:360px;
height:auto;
display:block;
object-fit:contain
}

/* PRODUCTS */
.section{max-width:1250px;margin:auto;padding:25px 5% 120px}
.title{margin-bottom:18px}
.line{width:42px;height:3px;background:var(--g);margin-bottom:9px}
.title h2{font-size:29px}
.title p{color:var(--m);font-size:13px}

.categories{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px}
.categories button{
border:1px solid var(--b);background:var(--w);color:var(--g);
padding:8px 14px;border-radius:20px;font-size:11px;font-weight:bold
}
.categories .active{background:var(--g);color:#fff}

.grid,.offer-grid{
display:grid;grid-template-columns:repeat(4,1fr);gap:14px
}
.card,.offer-card{
position:relative;background:var(--w);border:1px solid var(--b);
border-radius:20px;overflow:hidden;cursor:pointer;
transition:.2s
}
.card:hover{transform:translateY(-3px)}
.pic{
margin:9px;aspect-ratio:1;background:#eee5d6;border-radius:15px;
display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:65px
}
.pic img{width:100%;height:100%;object-fit:contain}
.info{padding:7px 12px 14px}
.badge,.offer-badge{
display:inline-block;padding:3px 8px;border-radius:15px;
font-size:9px;font-weight:bold
}
.badge{background:#f3c97d;color:#5c3f17}
.offer-badge{background:var(--o);color:#fff;margin-right:4px}
.name{font-size:14px;font-weight:bold;margin-top:5px}
.en{font-size:9px;color:var(--m)}
.weight{font-size:10px;color:#555;margin-top:3px}
.bottom{
display:flex;align-items:center;justify-content:space-between;margin-top:10px
}
.price,.new-price{font-size:18px;font-weight:bold;direction:ltr}
.old-price{
font-size:11px;color:#999;text-decoration:line-through;
margin-left:5px;direction:ltr
}
.new-price{color:var(--o)}
.discount{font-size:9px;font-weight:bold;color:var(--o);margin-right:5px}
.add{
width:35px;height:35px;border:0;border-radius:50%;
background:var(--g);color:#fff
}
.fav{
position:absolute;top:15px;left:15px;z-index:3;
width:34px;height:34px;border:0;border-radius:50%;
background:#fffdf8ee;color:var(--g);font-size:19px;
box-shadow:0 2px 8px #0002
}
.fav.on{color:var(--o)}
.empty{grid-column:1/-1;text-align:center;padding:50px;color:var(--m)}

/* OFFERS */
#offersSection{
display:none;max-width:1250px;margin:auto;padding:0 5% 20px
}
.offer-title{
display:flex;align-items:center;justify-content:space-between;margin-bottom:15px
}
.offer-title h2{font-size:26px}
.offer-title span{font-size:12px;color:var(--m)}
.offer-card .pic{margin:9px}
.offer-card .info{padding:7px 12px 15px}
.offer-label{
position:absolute;top:15px;right:15px;background:var(--o);color:#fff;
padding:5px 10px;border-radius:20px;font-size:10px;font-weight:bold;z-index:2
}

/* PRODUCT PAGE */
#productPage{display:none;padding:30px 5% 120px}
.detail{
max-width:1000px;margin:auto;background:var(--w);border-radius:25px;
overflow:hidden;display:grid;grid-template-columns:1fr 1fr
}
.detail-img{
min-height:430px;background:#eee5d6;
display:flex;align-items:center;justify-content:center;font-size:130px
}
.detail-img img{width:100%;height:100%;min-height:430px;object-fit:contain}
.detail-info{
padding:40px;display:flex;flex-direction:column;justify-content:center
}
.detail-cat{color:var(--o);font-size:12px;font-weight:bold}
.detail-name{font-size:32px;font-weight:bold}
.detail-en{color:var(--m);font-size:12px}
.options{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0}
.option{
border:1px solid var(--g);background:none;color:var(--g);
padding:8px 13px;border-radius:10px;font-weight:bold
}
.option.sel{background:var(--g);color:#fff}
.detail-price{font-size:30px;font-weight:bold;direction:ltr}
.detail-old-price{
font-size:15px;color:#999;text-decoration:line-through;direction:ltr
}
.detail-desc{font-size:13px;color:#59625b;margin:10px 0 18px}
.detail-add,.back{
border:0;padding:13px;border-radius:13px;font-weight:bold;font-size:15px
}
.detail-add{background:var(--o);color:#fff}
.back{background:var(--g);color:#fff;margin-top:8px}

/* BOTTOM NAV */
.bottom-nav{
position:fixed;z-index:50;bottom:14px;left:50%;
transform:translateX(-50%);width:min(850px,94%);
background:#fffdf8ee;backdrop-filter:blur(10px);
border:1px solid var(--b);border-radius:30px;padding:8px 15px;
display:flex;justify-content:space-around;box-shadow:0 8px 30px #0002
}
.bottom-nav button{
border:0;background:none;color:var(--m);
font-size:10px;font-weight:bold
}
.bottom-nav span{display:block;font-size:21px}
.bottom-nav .active{color:var(--o)}

/* PANELS */
.overlay{
display:none;position:fixed;inset:0;background:#0006;z-index:100
}
.panel,.menu-panel{
position:fixed;z-index:101;top:0;height:100vh;
background:var(--w);transition:.3s;display:flex;flex-direction:column
}
.panel{right:-430px;width:410px;max-width:94%}
.menu-panel{
left:-430px;width:360px;max-width:90%;box-shadow:8px 0 30px #0002
}

/* OPTION */
.option-modal{
display:none;position:fixed;inset:0;background:#0006;z-index:200;
align-items:center;justify-content:center;padding:20px
}
.option-box{
width:min(420px,100%);background:var(--w);
border-radius:22px;padding:25px 20px;position:relative
}
.option-close{
position:absolute;left:15px;top:15px;width:34px;height:34px;
border:0;border-radius:10px;background:var(--c2);color:var(--g);font-size:21px
}
.option-box h3{font-size:20px;margin-bottom:3px;padding-left:45px}
.option-box p{font-size:12px;color:var(--m);margin-bottom:16px}
.option-choices{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick-option{
border:1px solid var(--b);background:var(--c);color:var(--g);
padding:12px 8px;border-radius:12px;font-weight:bold
}
.pick-option small{display:block;color:var(--o);font-size:11px;margin-top:2px}

/* MENU */
.menu-head{
padding:22px 18px;background:var(--g);color:#fff;
display:flex;align-items:center;justify-content:space-between
}
.menu-brand{font:900 25px Georgia}
.menu-brand small{display:block;font:11px Tahoma;color:var(--gold)}
.menu-close{border:0;background:none;color:#fff;font-size:30px}
.menu-body{padding:14px}
.menu-btn{
width:100%;border:0;background:none;display:flex;align-items:center;
gap:13px;padding:15px 13px;border-radius:14px;color:var(--g);
font-size:14px;font-weight:bold;text-align:right;margin-bottom:4px
}
.menu-btn:hover{background:var(--c)}
.menu-icon{
width:36px;height:36px;border-radius:11px;background:var(--c2);
display:flex;align-items:center;justify-content:center;font-size:19px
}
.menu-divider{height:1px;background:var(--b);margin:10px 5px}
.menu-note{
padding:15px;margin-top:10px;background:var(--c);
border-radius:15px;font-size:11px;color:var(--m);text-align:center
}

/* CART */
.panel-head{
padding:18px;border-bottom:1px solid var(--b);
display:flex;justify-content:space-between
}
.close{
border:0;background:var(--c2);border-radius:10px;width:36px;height:36px;font-size:20px
}
.panel-body{flex:1;overflow:auto;padding:18px}
.cart-item{padding:15px 0;border-bottom:1px solid var(--b)}
.cart-row{display:flex;justify-content:space-between;gap:12px}
.cart-name{font-size:14px;font-weight:bold}
.cart-option{display:block;color:var(--m);font-size:11px}
.cart-price{color:var(--o);direction:ltr;font-size:15px}
.controls{display:flex;align-items:center;gap:10px;margin-top:10px}
.qty{
width:32px;height:32px;border:0;border-radius:9px;
background:var(--g);color:#fff;font-size:18px
}
.qty-number{min-width:20px;text-align:center}
.remove{
border:0;background:none;color:var(--o);
margin-right:auto;font-size:11px;padding:7px
}
.cart-empty{
display:flex;flex-direction:column;align-items:center;
justify-content:center;min-height:300px;text-align:center;color:var(--m)
}
.cart-empty span{font-size:50px}
.panel-foot{padding:17px;border-top:1px solid var(--b);background:var(--w)}
.total{
display:flex;justify-content:space-between;
font-size:19px;font-weight:bold;margin-bottom:12px
}
.checkout{
width:100%;border:0;background:var(--o);color:#fff;
padding:13px;border-radius:13px;font-weight:bold
}

/* CHECKOUT */
.form{margin-bottom:12px}
.form label{font-size:12px;font-weight:bold}
.input{
width:100%;border:1px solid var(--b);border-radius:10px;
padding:10px;margin-top:4px;outline:0;background:#fff
}
.area{height:65px;resize:none}
.summary{
background:var(--c);padding:12px;border-radius:13px;margin-top:12px
}
.summary-row{
display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px
}
.final{
border-top:1px solid var(--b);padding-top:10px;
font-weight:bold;font-size:17px
}

footer{
background:var(--g);color:#fff;text-align:center;padding:40px 20px 110px
}
.footer-logo{font:28px Georgia;color:var(--gold)}

@media(max-width:900px){
.grid,.offer-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:650px){
.site-logo{max-height:82px}
.icons{top:8px}
.icon{width:40px;height:40px}

.hero{
min-height:330px;
padding:35px 7%;
border-radius:25px
}

.hero-text{max-width:58%}
.hero h1{font-size:32px}
.hero p{font-size:12px}

.hero-branch{
width:38%;
}

.hero-branch img{
max-width:220px
}

.grid,.offer-grid{
grid-template-columns:repeat(2,1fr);gap:10px
}
.name{font-size:12px}
.price,.new-price{font-size:16px}
.add{width:32px;height:32px}

.detail{grid-template-columns:1fr}
.detail-img,.detail-img img{min-height:300px}
.detail-info{padding:25px}
.detail-name{font-size:28px}
.menu-panel{width:330px}
}
</style>
</head>

}

function nav(n){

.forEach((x,i)=>x.classList.toggle("active",i===n))
}

function categoriesHTML(){

$("cats").innerHTML=cats.map(x=>
`<button class="${x===category&&!onlyFav?"active":""}"
onclick="choose('${x}')">${x}</button>`).join("")

}

function discountPercent(a,b){
return Math.round((1-b/a)*100)
}

function priceHTML(p){

return p.oldPrice
?`<span class="old-price">$${p.oldPrice.toFixed(2)}</span>
<span class="new-price">$${p.price.toFixed(2)}</span>
<span class="discount">-${discountPercent(p.oldPrice,p.price)}%</span>`
:`<span class="price">${p.options?"من ":""}$${p.price.toFixed(2)}</span>`

}

function card(p){

let f=fav.includes(p.id);

return `<div class="card" onclick="detail('${p.id}')">

<button class="fav ${f?"on":""}"
onclick="toggleFav(event,'${p.id}')">${f?"♥":"♡"}</button>

<div class="pic">
${p.img?`<img src="${p.img}" alt="${p.name}">`:p.icon||"🛒"}
</div>

<div class="info">

<span class="badge">${p.cat}</span>

<div class="name">${p.name}</div>

<div class="en">${p.en}</div>

<div class="weight">${p.weight}</div>

<div class="bottom">

<div>${priceHTML(p)}</div>

<button class="add"
onclick="quick(event,'${p.id}')">+</button>

</div>

</div>

</div>`

}

function offerCard(p){

return `<div class="offer-card" onclick="detail('${p.id}')">

<div class="offer-label">🔥 عرض</div>

<div class="pic">
${p.img?`<img src="${p.img}" alt="${p.name}">`:p.icon||"🛒"}
</div>

<div class="info">

<div class="name">${p.name}</div>

<div class="en">${p.en}</div>

<div class="weight">${p.weight}</div>

<div class="bottom">

<div>${priceHTML(p)}</div>

<button class="add"
onclick="quick(event,'${p.id}')">+</button>

</div>

</div>

</div>`

}

);

fav=fav.includes(id)?
fav.filter(x=>x!==id):[...fav,id];

function quick(e,id){

e.stopPropagation();

let p=products.find(x=>x.id===id);

if(!p.options){

add({
name:p.name,
option:p.weight,
price:p.price
});

openCart();

return

}

openOptionPicker(p)

}

onclick="pickOption('${p.id}',${i})">
${o[0]}<small>$${o[1].toFixed(2)}</small>
</button>`).join("");

$("optionModal").style.display="flex"

}

function pickOption(id,i){

let p=products.find(x=>x.id===id),
o=p.options[i];

add({
name:p.name,
option:o[0],
price:o[1]
});

closeOptionPicker();

openCart()

}

function closeOptionPicker(){
$("optionModal").style.display="none"
}

function detail(id,opt=0){

let p=products.find(x=>x.id===id),

o=p.options?p.options[opt]:
[p.weight,p.price,p.img||p.icon||""];

if(tekramBackPosition===null)
tekramBackPosition=window.scrollY;

selected={
name:p.name,
option:o[0],
price:o[1],
oldPrice:p.oldPrice||null
};

$("dcat").textContent=p.cat;
$("dname").textContent=p.name;
$("den").textContent=p.en;
$("dweight").textContent=o[0];
$("dprice").textContent="$"+o[1].toFixed(2);
$("doldprice").textContent=p.oldPrice?"$"+p.oldPrice.toFixed(2):"";
$("ddesc").textContent=p.name+", "+o[0];

$("dimg").innerHTML=
typeof o[2]==="string"&&o[2].startsWith(".")
?`<img src="${o[2]}" alt="${p.name}">`
:`<span>${o[2]||p.icon||"🛒"}</span>`;

$("options").innerHTML=p.options?
p.options.map((x,i)=>
`<button class="option ${i===opt?"sel":""}"
onclick="detail('${p.id}',${i})">${x[0]}</button>`).join(""):"";

$("homePage").style.display="none";
$("productPage").style.display="block";

window.scrollTo(0,0)

}

function add(x){

let o=cart.find(i=>
i.name===x.name&&i.option===x.option
);

o?o.qty++:
cart.push({...x,qty:1});

save();

updateCart()

}

function addSelected(){

add(selected);

openCart()

}

function updateCart(){

$("count").textContent=
cart.reduce((a,x)=>a+x.qty,0);

if(!cart.length){

$("cartBody").innerHTML=
`<div class="cart-empty">
<span>🛒</span>
السلة فارغة
<small>أضف منتجاتك المفضلة من تِكرَم 🤍</small>
</div>`;

$("total").textContent="$0.00";

return

}

$("cartBody").innerHTML=cart.map((x,i)=>
`<div class="cart-item">

<div class="cart-row">

<div>

<div class="cart-name">${x.name}</div>

<span class="cart-option">${x.option}</span>

</div>

<b class="cart-price">
$${(x.price*x.qty).toFixed(2)}
</b>

</div>

<div class="controls">

<button class="qty"
onclick="qty(${i},-1)">−</button>

<b class="qty-number">${x.qty}</b>

<button class="qty"
onclick="qty(${i},1)">+</button>

<button class="remove"
onclick="removeItem(${i})">حذف</button>

</div>

</div>`).join("");

$("total").textContent="$"+
cart.reduce((a,x)=>a+x.price*x.qty,0).toFixed(2)

}

function qty(i,n){

cart[i].qty+=n;

if(cart[i].qty<1)
cart.splice(i,1);

save();

updateCart()

}

function removeItem(i){

cart.splice(i,1);

save();

updateCart()

}

async function sendOrder(){

let n=$("name").value.trim(),
ph=$("phone").value.trim(),
ar=$("area").value,
ad=$("address").value.trim();

if(!n||!ph||!ar||!ad)
return alert("يرجى تعبئة الاسم والهاتف والمنطقة والعنوان");

let sub=cart.reduce((a,x)=>a+x.price*x.qty,0);

let order=cart.map(x=>
`• ${x.name} | ${x.option} | ×${x.qty} | $${(x.price*x.qty).toFixed(2)}`
).join("\n");

$("send").disabled=true;

$("send").textContent="جاري الإرسال...";

try{

let r=await fetch(
"https://api.web3forms.com/submit",
{
method:"POST",
headers:{
"Content-Type":"application/json",
"Accept":"application/json"
},
body:JSON.stringify({

access_key:KEY,

subject:"🛒 طلب جديد من تِكرَم",

name:n,
phone:ph,
area:ar,
address:ad,

notes:$("notes").value,

order,

subtotal:"$"+sub.toFixed(2),

delivery:"$"+DELIVERY.toFixed(2),

total:"$"+(sub+DELIVERY).toFixed(2)

})
});

let data=await r.json();

if(data.success){
